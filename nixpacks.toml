# Nixpacks — يستخدمه Railway/Render عند البناء بلا Dockerfile.
#
# كان يضمّ tesseract + poppler لقراءة الملفات المصوّرة. أُزيلا مع إزالة
# مسار OCR: القراءة الآن عبر وكيل الرؤية، وتحويل PDF→صورة بـPyMuPDF
# داخل بايثون. النتيجة: بناء أسرع وصورة أخفّ، وبلا حزم نظام إطلاقًا.
[phases.setup]
nixPkgs = ["bash"]

[phases.install]
cmds = ["pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "python main.py"
